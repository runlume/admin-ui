name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check = 格式检查 + 类型 + lint + 单元测试 + 构建发布产物
      - run: pnpm check
      # 发布产物必须能被真实消费：打包后再冒烟引用一次
      - run: pnpm test:package
